# Local / narrow-context Nixpacks only. Production Coolify web uses repository-root context:
# root nixpacks.toml + Base Directory = / (see docs/COOLIFY-NEW-APP-WEB.md).
# Base Directory = new-app alone cannot see ../prisma — do not use for production Phone/Prisma builds.

[variables]
HOSTNAME = "0.0.0.0"
PORT = "3000"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
# Nixpacks Node 22 ships an older Corepack that cannot verify current pnpm release signatures.
cmds = [
  "npx --yes pnpm@12.3.4 install --frozen-lockfile",
]

[phases.build]
cmds = [
  "bash scripts/coolify-build.sh",
]

[start]
cmd = "node scripts/start-production.mjs"
