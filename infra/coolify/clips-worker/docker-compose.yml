# Clips CPU worker — run on Coolify host on network `coolify`.
# Build: docker build -f worker/Dockerfile -t clips-worker:latest .
# Env: copy from web app (DATABASE_URL, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY, WORKER_SHARED_SECRET, APP_URL).
services:
  clips-worker:
    image: clips-worker:latest
    container_name: clips-worker
    restart: unless-stopped
    env_file:
      - /opt/clips-worker/worker.env
    networks:
      - coolify
    environment:
      ASR_MODEL: small.en
      WORKER_ID: clips-worker-1
      WORKER_LANE: default

  clips-worker-stream:
    image: clips-worker:latest
    container_name: clips-worker-stream
    restart: unless-stopped
    env_file:
      - /opt/clips-worker/worker.env
    networks:
      - coolify
    environment:
      ASR_MODEL: small.en
      WORKER_ID: clips-worker-stream-1
      WORKER_LANE: stream

networks:
  coolify:
    external: true
