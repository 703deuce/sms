<!doctype html><html><head><meta charset="utf-8"><title>Motion Studio live preview (reference host)</title>
<!-- Reference host for the Transovo editor integration. NOT Transovo's editor: it shows the exact iframe + postMessage
     protocol Transovo's existing editor embeds next to its Compact/Timeline UI. -->
<style>body{margin:0;font:13px system-ui;background:#15171a;color:#ddd;display:flex;height:100vh}#stage{position:relative;flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden}
#wrap{position:relative;transform-origin:0 0}iframe{border:0;display:block;background:transparent}#boxes{position:absolute;inset:0;pointer-events:none}.bx{position:absolute;border:2px solid #ff0;box-sizing:border-box}.bx span{position:absolute;top:-16px;left:0;background:#ff0;color:#000;font-size:11px;padding:0 3px}
#side{width:380px;overflow:auto;padding:10px;background:#1d2024}#issues div{margin:2px 0}.error{color:#ff6b6b}.warning{color:#ffc857}.info{color:#8ecae6}img#poster{max-width:100%;max-height:100%}</style></head>
<body><div id="stage"><div id="wrap"></div></div><div id="side"><h3 id="title">-</h3><div id="cap"></div><div id="props"></div><h4>Issues</h4><div id="issues"></div><div id="log"></div></div>
<script type="module" src="host.js"></script></body></html>
