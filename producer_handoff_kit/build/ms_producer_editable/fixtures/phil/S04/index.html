<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent;overflow:hidden}canvas{display:block}</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
// S04 "the label, then the studio": PixiJS NGMC record (grooves, sheen, rotating label, tonearm, VU ring, dust). Time = seek(t) only.
// Parameterized production scene (contract transovo.editable-elements/1): label texts, label/ink/accent colours and the two label
// fonts come from resolved props; every motion function below is the original code. Text is PixiJS text (WebGL texture).
import * as PIXI from './lib/pixi.min.mjs';
import { MSRuntime } from './ms/ms-props-core.js';
const rt = await MSRuntime.boot(); let P = rt.P; const MAN = rt.manifest;
const hex = h => parseInt(h.slice(1), 16);
let MAG = hex(P.elements.record.labelColor), JET = hex(P.elements.record.ink), ACC = hex(P.elements.record.accent);
const DUR=164/30;
const app=new PIXI.Application(); await app.init({canvas:document.getElementById('c'),width:1080,height:1920,backgroundAlpha:0,antialias:true,autoStart:false,preference:'webgl',preserveDrawingBuffer:true});
app.ticker.stop();
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), eo=x=>1-Math.pow(1-clamp(x),3), bo=x=>{x=clamp(x);const s=1.4;return 1+(s+1)*Math.pow(x-1,3)+s*Math.pow(x-1,2)};
const R=320, CX=700, CY=500;
const root=new PIXI.Container(); app.stage.addChild(root);
// dust
const dust=new PIXI.Graphics(); app.stage.addChildAt(dust,0);
const motes=[...Array(70)].map((_,i)=>({x:(Math.sin(i*91.7)*0.5+0.5)*1080,y:(Math.sin(i*37.3)*0.5+0.5)*1920,r:2+((i*13)%5),v:20+((i*7)%40),a:0.15+((i*11)%10)/25}));
// VU ring
const vu=new PIXI.Graphics(); root.addChild(vu);
// disc
const disc=new PIXI.Container(); root.addChild(disc);
const shadow=new PIXI.Graphics().circle(14,22,R+6).fill({color:0x000000,alpha:0.55}); disc.addChild(shadow);
const g=new PIXI.Graphics(); g.circle(0,0,R).fill({color:0x0B0B0E}); for(let r=R-8;r>R*0.36;r-=5){g.circle(0,0,r).stroke({width:1.6,color:(r%15<5)?0x23232A:0x131318,alpha:1});}
g.circle(0,0,R).stroke({width:3,color:0x2E2E36}); g.circle(0,0,R*0.62).stroke({width:4,color:0x050507}); disc.addChild(g);
const spin=new PIXI.Container(); disc.addChild(spin);
// label geometry (sizes, y offsets, letter spacing) is the original layout; texts and fonts are editable
const LAYOUT=[['title',54,-38,'display'],['line1',20,16,'mono'],['line2',17,42,'mono'],['line3',15,70,'mono']], LAYOUT_B=[['title',58,-40,'display'],['line1',26,14,'mono'],['line2',17,46,'mono'],['line3',15,72,'mono']];
let issues=[]; const texts={};
function label(id,layout){const c=new PIXI.Container(); const L=new PIXI.Graphics().circle(0,0,R*0.34).fill({color:MAG}); L.circle(0,0,R*0.34-10).stroke({width:3,color:JET,alpha:0.5}); c.addChild(L);
  const E=P.elements[id]; const lim=MAN.elements.find(x=>x.id===id).layout.maxWidth;
  layout.forEach(([k,sz,y,role])=>{const sel=E[role==='display'?'titleFont':'lineFont'];
    const t=new PIXI.Text({text:E[k],style:{fontFamily:rt.family(sel),fontSize:sz,fill:JET,fontWeight:String(sel.weight||(role==='display'?900:700)),letterSpacing:role==='mono'?2:0}}); t.anchor.set(0.5); t.y=y;
    // auto-fit inside the label: shrink to >= 70% of the design size, else overflow error
    let s=sz; while(t.width>lim[k]+0.5 && s>sz*0.7){ s-=1; t.style.fontSize=s; }
    if(s!==sz) issues.push({severity:'info',code:'AUTOFIT_APPLIED',element:id,prop:k,message:`${sz}px -> ${s}px`});
    if(t.width>lim[k]+0.5) issues.push({severity:'error',code:'TEXT_OVERFLOW',element:id,prop:k,message:`${Math.round(t.width)}px > ${lim[k]}px label width at ${s}px`});
    texts[id+'.'+k]=t; c.addChild(t);});
  const hole=new PIXI.Graphics().circle(0,0,9).fill({color:0x050507}); c.addChild(hole); return c;}
let labA=label('labelA',LAYOUT), labB=label('labelB',LAYOUT_B);
spin.addChild(labA); spin.addChild(labB);
// sheen wedges (light stays still while the record turns)
const sheen=new PIXI.Graphics(); disc.addChild(sheen);
function wedge(gr,a0,a1,alpha){gr.moveTo(0,0);for(let k=0;k<=12;k++){const a=a0+(a1-a0)*k/12;gr.lineTo(Math.cos(a)*R*0.98,Math.sin(a)*R*0.98);}gr.closePath().fill({color:0xFFFFFF,alpha});}
// tonearm
const arm=new PIXI.Container(); root.addChild(arm); arm.x=CX+R*0.78; arm.y=CY-R*1.02;
const base=new PIXI.Graphics().circle(0,0,46).fill({color:0xC9CCD3}).circle(0,0,46).stroke({width:4,color:0x6E727C}).circle(0,0,20).fill({color:0x2A2A30}); 
const rod=new PIXI.Graphics().roundRect(-7,0,14,R*1.05,7).fill({color:0xE6E8EC}).roundRect(-7,0,14,R*1.05,7).stroke({width:2,color:0x6E727C});
const head=new PIXI.Graphics(); const paintHead=()=>{head.clear().roundRect(-20,R*1.03,40,64,8).fill({color:0x1A1A1F}).roundRect(-20,R*1.03,40,64,8).stroke({width:3,color:ACC});}; paintHead();
arm.addChild(rod); arm.addChild(head); arm.addChild(base);
const BEAT=60/88;
window.__scene={fps:30,duration:DUR,seek:async(t)=>{
  // disc slides in from the right with spin, then settles; slow drift after
  const e=eo(t/0.55); disc.x=CX+(1-e)*900+Math.sin(t*0.7)*6; disc.y=CY+(1-e)*80+Math.cos(t*0.6)*5; vu.x=disc.x; vu.y=disc.y;
  const ang=(t<0.55? (1-e)*-9 : 0) + t*2*Math.PI*0.55; spin.rotation=ang;
  // label flip at 3.08 s ("Then, his own studio")
  const fl=clamp((t-3.02)/0.24); const sx=Math.cos(fl*Math.PI); labA.visible=sx>0; labB.visible=sx<=0; labA.scale.x=Math.abs(sx)||0.001; labB.scale.x=Math.abs(sx)||0.001;
  sheen.clear(); const s0=-0.9+Math.sin(t*0.5)*0.08; wedge(sheen,s0,s0+0.32,0.07); wedge(sheen,s0+Math.PI,s0+Math.PI+0.32,0.05); wedge(sheen,s0+0.08,s0+0.16,0.08);
  // tonearm swings on (0.55-1.05 s)
  arm.rotation=0.55-0.42*bo((t-0.55)/0.5);
  // VU ring after the flip
  vu.clear(); const vr=clamp((t-3.1)/0.3);
  if(vr>0){for(let i=0;i<84;i++){const a=i/84*Math.PI*2; const ph=(t%BEAT)/BEAT; const env=Math.exp(-ph*4);
    const n=0.35+0.65*Math.abs(Math.sin(i*1.7+t*9.0)*Math.cos(i*0.33-t*5.3)); const L=(12+48*n*(0.45+0.55*env))*vr;
    const r0=R+16; vu.moveTo(Math.cos(a)*r0,Math.sin(a)*r0).lineTo(Math.cos(a)*(r0+L),Math.sin(a)*(r0+L)).stroke({width:7,color:i%7===0?0xFFFFFF:ACC,alpha:0.9,cap:'round'});}}
  // dust drifts up
  dust.clear(); for(const m of motes){const y=((m.y-m.v*t)%1920+1920)%1920; dust.circle(m.x+Math.sin(t+m.y)*8,y,m.r).fill({color:ACC,alpha:m.a*clamp(t/0.4)});}
  app.renderer.render(app.stage);
}};
window.__ready=true;
let lastT=0; const seek0=window.__scene.seek; window.__scene.seek=async t=>{lastT=t; await seek0(t);};
rt.attach({
  async apply(R2){ P=R2; MAG=hex(P.elements.record.labelColor); JET=hex(P.elements.record.ink); ACC=hex(P.elements.record.accent); issues=[]; for(const k in texts) delete texts[k];
    spin.removeChildren().forEach(c=>c.destroy({children:true})); labA=label('labelA',LAYOUT); labB=label('labelB',LAYOUT_B); spin.addChild(labA); spin.addChild(labB); paintHead(); },
  layout: () => issues,
  boundsNeedSeek: true,
  bounds(){ const out={}; for(const [k,t] of Object.entries(texts)){ if(!t.parent||!t.parent.visible) continue; const b=t.getBounds(); const id=k.split('.')[0]; const r={x:Math.round(b.x),y:Math.round(b.y),w:Math.round(b.width),h:Math.round(b.height)};
      if(!out[id]) out[id]={...r,space:'projected',engine:'pixi'}; else { const o=out[id]; const x1=Math.max(o.x+o.w,r.x+r.w), y1=Math.max(o.y+o.h,r.y+r.h); o.x=Math.min(o.x,r.x); o.y=Math.min(o.y,r.y); o.w=x1-o.x; o.h=y1-o.y; } }
    const db=disc.getBounds(); out.record={x:Math.round(db.x),y:Math.round(db.y),w:Math.round(db.width),h:Math.round(db.height),space:'projected',engine:'pixi'}; return out; }
});
window.__msWidths=()=>Object.fromEntries(Object.entries(texts).map(([k,t])=>[k,Math.round(t.width*10)/10]));
</script></body></html>
