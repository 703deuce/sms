# snapshot.conf - single source of truth for the AgentLab backup. Sourced by sync.sh (bash).
# Edit here to change what is backed up. No secret VALUES belong in this file.

SERVER_SSH="ssh -i $HOME/.ssh/agentlab_root_ed25519 -o IdentitiesOnly=yes -o ConnectTimeout=20 root@204.168.139.158"
REPO="703deuce/sms"
BASE_BRANCH="master"
FOLDER="agentlab-backend"
BRANCH_PREFIX="agentlab-backend-backup"
AGE_IDENTITY="/home/box/.agentlab_backup/age-identity.txt"   # PRIVATE, never in repo
AGE_RECIPIENT_FILE="/home/box/.agentlab_backup/age-recipient.pub"  # public, committed
GITHUB_ENV_FILE="/home/box/.transovo_team_secrets.env"        # holds GITHUB_TOKEN
MAX_FILE_KB=5120                                              # skip files >= 5 MB

# ---- Code to pull from the server (paths absolute; stored under server/<path>) ----
SERVER_INCLUDE=(
  /opt/agent/runner /opt/agent/tools /opt/agent/ops /opt/agent/embed
  /opt/agent/connectors /opt/agent/phone /opt/agent/oh-home
  /opt/agent/workspace/skills /opt/agent/workspace/tools /opt/agent/workspace/memory/projects
  /opt/agent/tests /opt/agent/build /opt/agent/staged /opt/agent/skills-src /opt/agent/searxng
  /opt/agent/desktop /opt/agent/AGENTS.md /opt/agent/run.sh /opt/agent/sync-settings.sh
  /etc/systemd/system/agent-lab-*.service /etc/systemd/system/agent-lab-*.timer
  /etc/systemd/system/agent-lab-*.service.d /etc/systemd/system/agentlab-*.service
  /etc/systemd/system/agentlab-*.timer /etc/systemd/system/agentlab-*.service.d
)
# Directory names pruned anywhere in the tree
EXCLUDE_DIRS=(
  __pycache__ venv .venv node_modules .git .cache cache models pylib mcp-fetch-pkgs ruff
  backups jobs runs usage webcache secrets bak-* .mozilla chrome-profile browser-profile
  conversations pages shots testdata inbox tmp fonts
)
# File name globs skipped anywhere
EXCLUDE_FILES=(
  .env '*.env' '*.env.*' '*.pem' '*.key' '*.p12' '*.pfx' 'id_rsa*' 'id_ed25519*' '*.crt'
  '*.db' '*.db-wal' '*.db-shm' '*.sqlite' '*.sqlite3' '*.log' '*.pyc' '*.pid' Xauthority
  '*.safetensors' '*.onnx' '*.gguf' '*.pt' '*.bin' '*.wav' '*.mp3' '*.mp4' '*.ogg' '*.webm' '*.mov'
  '*.zip' '*.tar' '*.tgz' '*.tar.gz' '*.pdf'
  'cookies*' 'Cookies*' '*cookie*' '*token*.json' '*credentials*' 'Login Data*' '*.jsonl'
  '*.orig' '*.bak' '*.bak-*' '*.lock'
)

# ---- Encrypted secrets bundle (tar on server -> age on this box; never plaintext on disk) ----
SECRETS_INCLUDE=(
  /opt/agent/secrets /opt/agent/workspace/secrets /opt/agent/.env
  /opt/agent/oh-home /opt/agent/searxng /opt/agent/runner/state
)
SECRETS_OUT="secrets.tar.age"

# ---- Local (this box) docs/code to include; "src|dest" under local/ ----
LOCAL_INCLUDE=(
  "/workspace/transovo_team/AGENTLAB_HANDOFF.md|local/transovo_team/AGENTLAB_HANDOFF.md"
  "/workspace/transovo_team/research/agentlab-*|local/transovo_team/research/"
  "/workspace/transovo_team/research/gap-fixes-status.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/cursor-efficiency-status.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/model-routing-production-agents.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/prompt-tool-caching-production-agents.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/agent-egress-proxies.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/haiku-default-lean-context.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/haiku-vs-opus-routing.md|local/transovo_team/research/"
  "/workspace/transovo_team/research/haiku-vs-opus-14-tests.md|local/transovo_team/research/"
  "/workspace/agentlab_phone/*.md|local/agentlab_phone/"
  "/workspace/agentlab_phone/src|local/agentlab_phone/"
  "/workspace/agentlab_phone/docs11|local/agentlab_phone/"
  "/workspace/agentlab_fix/*.md|local/agentlab_fix/"
)
