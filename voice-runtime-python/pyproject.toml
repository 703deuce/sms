[project]
name = "transovo-voice"
version = "0.1.0"
description = "Transovo Python LiveKit voice runtime"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "livekit-agents[openai]~=1.8",
  "livekit-plugins-deepgram>=0.6,<1",
  "livekit-plugins-noise-cancellation>=0.2,<0.4",
  "httpx>=0.27,<0.29",
  "pydantic>=2.7,<3",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9",
  "pytest-asyncio>=0.24,<0.25",
]

[project.scripts]
transovo-voice = "transovo_voice.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["transovo_voice"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
