# Coolify/Nixpacks: transovo-web only (Next.js + BullMQ). Voice worker is a separate image.
# NODE_OPTIONS heap is applied only during next build (see coolify-build script).

[variables]
HOSTNAME = "0.0.0.0"
PORT = "3000"

[phases.setup]
aptPkgs = ["...", "libvips42"]

[phases.install]
cmds = [
  "bash scripts/coolify-install-with-heartbeat.sh",
]

[phases.build]
cmds = [
  "bash scripts/deploy-db-migrations.sh",
  "bash scripts/coolify-build-with-heartbeat.sh",
]
