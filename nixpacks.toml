# Coolify/Nixpacks: LEGACY transovo-web (monolith). Primary site should use Base Directory `new-app`
# and new-app/nixpacks.toml instead — see docs/COOLIFY-NEW-APP-WEB.md.
# Coolify/Nixpacks: transovo-web (Next.js + BullMQ). Voice worker is a separate image.
# Web app: full next build. Scheduler (trransovo-smscheduler): set COOLIFY_SKIP_NEXT_BUILD=1
# on that Coolify application (build-time env) — see scripts/coolify-configure-scheduler-build.sh.
# NODE_OPTIONS heap is applied only during next build (see coolify-build script).

[variables]
HOSTNAME = "0.0.0.0"
PORT = "3000"

[phases.setup]
aptPkgs = ["...", "libvips42"]

[phases.install]
cmds = [
  "bash scripts/coolify-install-with-heartbeat.sh",
]

[phases.build]
cmds = [
  "bash scripts/deploy-db-migrations.sh",
  "bash scripts/coolify-build-with-heartbeat.sh",
]
