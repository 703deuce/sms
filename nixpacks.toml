# Coolify/Nixpacks: install + build tuned for ~4GB build VMs.
# NODE_OPTIONS heap is applied only during next build (see coolify-build script).

[phases.install]
cmds = [
  "bash scripts/coolify-install-with-heartbeat.sh",
]

[phases.build]
cmds = [
  "bash scripts/coolify-build-with-heartbeat.sh",
]
