# Coolify/Nixpacks: transovo-new-app; Prisma source of truth is new-app/prisma/.
# Coolify web app (ds8s3hjin60qs6g7s0iqkixs): Base Directory = / (empty), Build pack = Nixpacks.
# Legacy monolith: nixpacks.legacy-monolith.toml — see docs/COOLIFY-NEW-APP-WEB.md.

[variables]
HOSTNAME = "0.0.0.0"
PORT = "3000"
PRISMA_GENERATE_SKIP_AUTOINSTALL = "true"

[phases.setup]
nixPkgs = ["nodejs_22"]

[phases.install]
cacheDirectories = ["/root/.local/share/pnpm/store"]
cmds = [
  "cd new-app && npx --yes pnpm@12.3.4 install --frozen-lockfile --store-dir /root/.local/share/pnpm/store",
]

[phases.build]
# DB migrations run at container start (new-app/scripts/start-production.mjs), not during
# image build — build containers often cannot reach Supabase (P1001).
cmds = [
  "cd new-app && bash scripts/coolify-build.sh",
]

[start]
cmd = "bash -lc 'cd new-app && node scripts/start-production.mjs'"
