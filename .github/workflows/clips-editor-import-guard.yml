name: Clips editor import guards

on:
  push:
    branches: [master, "cursor/**"]
    paths:
      - "new-app/components/clips/editor/editor-shell.tsx"
      - "new-app/scripts/verify-editor-shell-import.mjs"
      - "new-app/scripts/verify-editor-jsx-imports.mjs"
      - "new-app/scripts/verify-clip-editor-feature-parity.mjs"
      - "new-app/tests/layout-panel-mount.test.tsx"
      - ".github/workflows/clips-editor-import-guard.yml"
  pull_request:
    branches: [master]
    paths:
      - "new-app/components/clips/**"
      - "new-app/lib/clips/**"
      - "new-app/components/ai-producer-agent/**"
      - "new-app/lib/ai-producer-agent/**"
      - "new-app/lib/server/ai-producer-agent/**"
      - "new-app/app/api/ai-producer-agent/**"

jobs:
  editor-shell-import-guard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: new-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run verify:editor-shell-import
      - run: pnpm run verify:editor-hook-imports
      - run: pnpm run verify:editor-jsx-imports
      - run: pnpm run verify:clip-editor-feature-parity
      - run: pnpm run verify:editor-shell-hook-order
      - run: pnpm run verify:clips-editor-eslint
      - run: pnpm exec vitest run tests/editor-shell-use-editor-words.test.ts tests/editor-shell-render.test.tsx tests/editor-shell-ssr.test.tsx tests/clip-editor-features-mount.test.tsx tests/editor-layout-repair.test.tsx tests/unified-editor-workspace.test.tsx tests/editor-density-defaults.test.ts tests/text-template-panel-add.test.tsx tests/editor-words-merge.test.ts tests/caption-overlay-preview.test.tsx tests/clip-timeline.test.ts tests/audio-panel-fades.test.tsx tests/layers-actual-stack.test.tsx tests/timeline-e2-render.test.tsx tests/transcript-cut-source-time.test.tsx tests/editor-words-route-contract.test.ts tests/use-editor-words-source-time.test.tsx tests/caption-style-snapshot.test.ts tests/caption-sync-warning.test.ts tests/asr-language-catalog.test.ts tests/export-nle-captions-srt.test.ts tests/export-dialog-nle-download.test.tsx tests/export-dialog-caption-sync.test.tsx
      - run: pnpm run typecheck:clips
