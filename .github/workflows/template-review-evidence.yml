name: Template review evidence

on:
  push:
    branches: [master]
    paths:
      - "new-app/lib/clips/real-video-templates/review-evidence.ts"
      - "new-app/scripts/template-review-evidence.ts"
      - "new-app/tests/clips/template-review-evidence.test.ts"
      - "new-app/tsconfig.real-video-template-review.json"
      - "new-app/scripts/typecheck-template-review-evidence.sh"
      - ".github/workflows/template-review-evidence.yml"
  workflow_dispatch:

concurrency:
  group: template-review-evidence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 12.3.4 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: new-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: new-app
      - run: pnpm typecheck:templates:review
        working-directory: new-app
      - run: pnpm test:templates:review
        working-directory: new-app
