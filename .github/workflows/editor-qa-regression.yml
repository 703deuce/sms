name: Editor QA regression

on:
  pull_request:
    branches: [master]
    paths:
      - "new-app/components/clips/editor/**"
      - "new-app/components/ai-producer-agent/**"
      - "new-app/lib/ai-producer-agent/**"
      - "new-app/lib/server/ai-producer-agent/**"
      - "new-app/app/api/ai-producer-agent/**"
      - "worker/clips_worker/ai_producer_agent/**"
      - "worker/clips_worker/streamer/agent_prepare_job.py"
      - "worker/clips_worker/streamer/agent_batch_job.py"
      - "new-app/lib/server/streamer/agent-batch.ts"
      - "new-app/lib/streamer/agent-batch-contract.ts"
      - "worker/tests/test_stream_agent_prepare.py"
      - "new-app/lib/clips/**"
      - "new-app/tests/**"
      - "worker/clips_worker/captions_ass.py"
      - "worker/clips_worker/bg_removal.py"
      - "worker/modal_app/matte.py"
      - "worker/tests/test_e8_caption_size.py"
      - ".github/workflows/editor-qa-regression.yml"

jobs:
  editor-regression:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: new-app/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Streamer agent batch typecheck
        run: |
          NODE_OPTIONS=--max-old-space-size=8192 pnpm exec tsc -p tsconfig.typecheck.json --noEmit --pretty false > /tmp/streamer-tsc.txt 2>&1 || true
          if grep -E '^(app/api/(streamer/agent-|internal/streamer/agent-)|lib/server/streamer/agent-|lib/streamer/agent-batch|components/streamer/streamer-agent-clip-maker).*error TS' /tmp/streamer-tsc.txt; then
            echo "Streamer agent batch TypeScript errors" >&2
            exit 1
          fi
      - name: Editor import and hook guards
        run: |
          pnpm run verify:editor-shell-import
          pnpm run verify:editor-hook-imports
      - name: Editor QA regression tests
        run: |
          pnpm exec vitest run \
            tests/a1-transcript-cut-map.test.ts \
            tests/editor-audio-cut-boundaries.test.ts \
            tests/editor-audio-only-filler.test.ts \
            tests/editor-audio-only-filler-ui.test.tsx \
            tests/clip-timeline.test.ts \
            tests/timeline-e2-render.test.tsx \
            tests/c1-laptop-lanes.test.ts \
            tests/clip-timeline.test.ts \
            tests/editor-state-ripple.test.tsx \
            tests/clip-filler-review-lifecycle.test.tsx \
            tests/unified-editor-workspace.test.tsx \
            tests/history-labels.test.ts \
            tests/bg-removal-section-preview.test.tsx \
            tests/editor-words-refetch.test.ts \
            tests/use-editor-words-source-time.test.tsx \
            tests/text-template-panel-add.test.tsx \
            tests/g1a-canvas-ui.test.tsx \
            tests/layers-actual-stack.test.tsx \
            tests/preview-stage-e3.test.tsx \
            tests/e8-caption-size-parity.test.ts \
            tests/ef24-bg-removal-edits.test.ts \
            tests/stock-audio-picker-placement.test.tsx \
            tests/batch5-template-full-video.test.tsx \
            tests/fullsuite-batch2.test.ts \
            tests/fullsuite-batch3.test.ts \
            tests/fullsuite-batch4.test.tsx \
            tests/fullsuite-batch4-brand.test.tsx \
            tests/fullsuite-batch5.test.ts \
            tests/editor-retest6-controls.test.tsx \
            tests/editor-retest6-menu.test.tsx \
            tests/editor-retest7-state.test.tsx \
            tests/editor-retest8-persistence.test.ts \
            tests/editor-retest8-matte.test.tsx \
            tests/editor-audit-save-history.test.tsx \
            tests/editor-audit-transcript.test.tsx \
            tests/editor-audit-matte.test.ts \
            tests/editor-audit-rename.test.tsx \
            tests/silence-trim-polish.test.ts \
            tests/cleanup-proposals.test.ts \
            tests/ai-producer-agent/just-chatting-rough-cut.test.ts \
            tests/ai-producer-agent/just-chatting-editorial-direction.test.ts \
            tests/ai-producer-agent/specialists.test.ts \
            tests/ai-producer-agent/specialist-workflow.test.ts \
            tests/ai-producer-agent/orchestrator.mock-luna.test.ts \
            tests/ai-producer-agent/ai-producer-export.test.ts \
            tests/ai-producer-agent/producer-duration-layout.test.tsx \
            tests/ai-producer-agent/short-story-repair.test.ts \
            tests/ai-producer-agent/story-finisher.test.ts \
            tests/ai-producer-agent/sentence-boundary-regression.test.ts \
            tests/ai-producer-agent/highlights-finisher.test.ts \
            tests/ai-producer-agent/short-story-coverage.test.ts \
            tests/ai-producer-agent/highlights-mode.test.ts \
            tests/ai-producer-agent/absolute-timebase-multicut.test.ts \
            tests/ai-producer-agent/short-source-story-coverage.test.ts \
            tests/ai-producer-agent/system-prompt.test.ts \
            tests/ai-producer-agent/validate.items.test.ts \
            tests/ai-producer-agent/visual-evidence.test.ts \
            tests/ai-producer-agent/visual-action-beats.test.ts \
            tests/ai-producer-agent/assembly-segment-args.test.ts \
            tests/ai-producer-agent/multi-source-story.test.ts \
            tests/ai-producer-agent/clean-take.test.ts \
            tests/ai-producer-agent/multi-source-assembly.test.ts \
            tests/streamer-agent-windows.test.ts \
            tests/streamer-agent-batch-contract.test.ts

  captions-worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all clips-worker modules and worker tests
        run: python -m py_compile worker/clips_worker/*.py worker/tests/*.py worker/modal_app/matte.py
      - run: python -m pip install pytest
      - run: PYTHONPATH=worker python -m pytest -q worker/tests/test_e8_caption_size.py worker/tests/test_export_duration_guard.py worker/tests/test_audio_only_mute.py

  visual-audio-worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile visual worker modules
        run: python -m py_compile worker/clips_worker/ai_producer_agent/finder/*.py worker/clips_worker/streamer/agent_prepare_job.py worker/clips_worker/streamer/agent_batch_job.py worker/tests/test_ai_producer_visual_audio.py worker/tests/test_stream_agent_prepare.py
      - name: Install isolated test dependencies
        run: python -m pip install pytest requests boto3
      - name: Exercise Gemini visual contracts and streamer video source-window alignment
        run: PYTHONPATH=worker python -m pytest -q worker/tests/test_ai_producer_visual_audio.py worker/tests/test_stream_agent_prepare.py
