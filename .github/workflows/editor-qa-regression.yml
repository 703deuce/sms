  real-video-template-b3b:
    name: Real video template B3B editable timeline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: new-app/pnpm-lock.yaml
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install new-app dependencies
        working-directory: new-app
        run: pnpm install --frozen-lockfile
      - name: Generate Prisma client
        working-directory: new-app
        run: pnpm exec prisma generate --schema=prisma/schema.prisma
      - name: Batch 3 + 3B Vitest suites
        working-directory: new-app
        run: |
          pnpm exec vitest run \
            tests/clips/real-video-templates-b3.test.ts \
            tests/clips/real-video-template-instance.test.ts \
            tests/clips/real-video-template-editor.test.tsx \
            tests/clips/real-video-template-b3b-editable-timeline.test.tsx
      - name: Batch 3B scoped TypeScript
        working-directory: new-app
        run: NODE_OPTIONS=--max-old-space-size=8192 pnpm exec tsc -p tsconfig.real-video-templates.json --noEmit --pretty false
      - name: Full new-app TypeScript diagnostic gate
        working-directory: new-app
        run: |
          NODE_OPTIONS=--max-old-space-size=8192 pnpm exec tsc -p tsconfig.typecheck.json --noEmit --pretty false > /tmp/b3b-full-tsc.txt 2>&1 || true
          cat /tmp/b3b-full-tsc.txt
          if grep -E '^(lib/clips/real-video-templates/|lib/clips/editor/(sources|motion-frame|motion-schema|keyframes|source-segment-motion)\.ts|lib/clips/edits(-version-hash)?\.ts|lib/server/clips/real-video-template-instances\.ts|components/clips/editor/(motion-preview|preview-stage|script-view-compact-timeline|media-panel|editor-shell|timeline)\.(ts|tsx)|app/api/clips/(video-templates/publish|clips/\[id\]/template-authoring|projects/\[id\]/template-instance)/route\.ts|tests/clips/real-video-template).*error TS' /tmp/b3b-full-tsc.txt; then
            echo "Batch 3B-owned TypeScript diagnostics found" >&2
            exit 1
          fi
      - name: Generate machine-readable editable timeline proof
        working-directory: new-app
        run: |
          pnpm exec tsx scripts/prove-real-video-template-editable-structure.ts > ../editable-timeline-structure-proof.json
          node -e 'const fs=require("fs"); const p=JSON.parse(fs.readFileSync("../editable-timeline-structure-proof.json","utf8")); if(p.schema!=="transovo.real-video-template.editable-timeline-proof.v1" || p.cases.length!==3 || !p.cases.every(c=>c.matches)) process.exit(1); console.log(p.cases.map(c=>c.id+":"+c.actual.mediaItems.length+" items").join(", "))'
      - uses: actions/upload-artifact@v4
        with:
          name: real-video-template-editable-timeline-proof
          path: editable-timeline-structure-proof.json
      - name: Compile Batch 3B worker modules
        run: python -m py_compile worker/clips_worker/motion.py worker/clips_worker/media_sources.py worker/tests/test_real_video_template_sequence.py
      - name: Install ffmpeg and pytest
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install pytest
      - name: Batch 3B worker FFmpeg proof
        run: PYTHONPATH=worker python -m pytest -q -rs --tb=short worker/tests/test_real_video_template_sequence.py

  captions-worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile all clips-worker modules and worker tests
        run: python -m py_compile worker/clips_worker/*.py worker/tests/*.py worker/modal_app/matte.py
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Confirm ffmpeg is installed
        run: ffmpeg -version && ffprobe -version
      - run: python -m pip install pytest
      - name: Caption, export-duration, and real-video-template worker tests
        run: |
          PYTHONPATH=worker python -m pytest -q -rs --tb=short \
            --junitxml=/tmp/captions-worker-regression.xml \
            worker/tests/test_e8_caption_size.py \
            worker/tests/test_export_duration_guard.py \
            worker/tests/test_audio_only_mute.py \
            worker/tests/test_caption_lines.py \
            worker/tests/test_caption_ass_sentence_case.py \
            worker/tests/test_real_video_template_sequence.py
          bash .github/scripts/pytest-junit-guard.sh \
            /tmp/captions-worker-regression.xml captions-worker-regression
  visual-audio-worker-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile visual worker modules
        run: python -m py_compile worker/clips_worker/ai_producer_agent/finder/*.py worker/clips_worker/streamer/agent_prepare_job.py worker/clips_worker/streamer/agent_batch_job.py worker/tests/test_ai_producer_visual_audio.py worker/tests/test_stream_agent_prepare.py
      - name: Install isolated test dependencies
        run: python -m pip install pytest requests boto3
      - name: Exercise Gemini visual contracts and streamer video source-window alignment
        run: |
          PYTHONPATH=worker python -m pytest -q -rs --tb=short \
            --junitxml=/tmp/visual-audio-worker-regression.xml \
            worker/tests/test_ai_producer_visual_audio.py \
            worker/tests/test_stream_agent_prepare.py
          bash .github/scripts/pytest-junit-guard.sh \
            /tmp/visual-audio-worker-regression.xml visual-audio-worker-regression

  motion-graphics-mp4-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Confirm ffmpeg is installed
        run: ffmpeg -version && ffprobe -version
      - name: Install minimal proof dependencies
        run: python -m pip install pytest
      - name: Render actual annotated MP4 and verify output video/audio
        run: |
          PYTHONPATH=worker python -m pytest -q -rs --tb=short \
            --junitxml=/tmp/mg-smoke.xml \
            worker/tests/test_motion_graphics_export.py
          python -c 'import sys, xml.etree.ElementTree as ET; root = ET.parse("/tmp/mg-smoke.xml").getroot(); suites = [root] if root.tag == "testsuite" else list(root.findall("testsuite")); skipped = sum(int(s.attrib.get("skipped", 0)) for s in suites); tests = sum(int(s.attrib.get("tests", 0)) for s in suites); print("motion-graphics-mp4-smoke: collected=%s skipped=%s" % (tests, skipped)); sys.exit("Failing because %s test(s) were skipped" % skipped) if skipped else None'
