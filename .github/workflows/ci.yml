name: CI

on:
  push:
    branches: [master, "cursor/**"]
  pull_request:
    branches: [master]

jobs:
  voice-agent-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npx tsc --noEmit
      - run: npm run build:voice-python
      - run: npm run test:voice-web-split
      - run: npm run verify:voice-v2-caller-experience-law
      - run: npm run test:realtor-release-gate
      - run: npm run test:agent-runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: clips worker pytest
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install pytest numpy==1.26.4 opencv-contrib-python-headless scenedetect==0.7.2 "supervision>=0.30.9,<0.31"
          PYTHONPATH=worker python3 -m pytest -q \
            worker/tests/test_reframe_director.py \
            worker/tests/test_reframe_ffmpeg_graphs.py \
            worker/tests/test_clip_layout_env.py \
            worker/tests/test_detect_facecam_sampling.py \
            worker/tests/test_multiperson_clipper.py \
            worker/tests/test_reframe_core_pure.py \
            worker/tests/test_reframe_v2_gate.py \
            worker/tests/test_director_cfg_live.py \
            worker/tests/test_render_ai_meta.py \
            worker/tests/test_reframe_model_names.py \
            worker/tests/test_layout_router.py \
            worker/tests/test_reframe_integration.py \
            worker/tests/test_director_calm.py \
            worker/tests/test_smoothing_calm.py \
            worker/tests/test_person_count_probe.py
