name: Motion creator experience checks
on:
  pull_request:
    paths:
      - 'new-app/components/motion-studio/**'
      - 'new-app/lib/motion-studio/**'
      - 'new-app/lib/server/motion-studio/**'
      - 'new-app/app/api/motion-studio/**'
      - 'new-app/prisma/**'
      - 'new-app/tests/motion-studio/**'
      - 'producer_handoff_kit/skills/motion-studio-production/**'
      - '.github/workflows/motion-creator-pr.yml'
  workflow_dispatch:
jobs:
  creator:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: new-app/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Generate Prisma models
        run: npx prisma generate --schema prisma/schema.prisma
      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://tester:tester@localhost:5432/transovo
          DIRECT_URL: postgresql://tester:tester@localhost:5432/transovo
        run: npx prisma validate --schema prisma/schema.prisma
      - name: Creator tests
        run: npx vitest run tests/motion-studio/motion-studio-create.test.tsx tests/motion-studio/production-brief.test.ts
      - name: TypeScript creator-specific regression gate
        shell: bash
        run: |
          npx tsc --noEmit --pretty false > /tmp/creator-tsc.log 2>&1 || true
          echo "Whole-app errors (pre-existing baseline not gated): $(grep -c 'error TS' /tmp/creator-tsc.log || true)"
          if grep -E '^(components/motion-studio/|lib/motion-studio/production-brief|lib/motion-studio/types|lib/server/motion-studio/(service|agent-bridge|voices)|app/api/motion-studio/voices/|tests/motion-studio/(motion-studio-create|production-brief))' /tmp/creator-tsc.log | grep 'error TS'; then
            echo "Creator-specific TypeScript regression detected"
            exit 1
          fi
          echo "No TypeScript errors in the creator release files."
